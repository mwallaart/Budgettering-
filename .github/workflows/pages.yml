name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; lopende runs niet afbreken
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Poort vóór de deploy: faalt een controle, dan gaat er niets live.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Testafhankelijkheden installeren
        run: npm ci

      # De app zelf heeft geen dependencies; Chromium is alleen nodig om de
      # controles in een echte browser te laten lopen.
      - name: Chromium installeren
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Interacties en animaties
        run: npm run test:interactions

      - name: Smoketest (schermen, sheets, 320px, donker thema)
        run: npm run test:smoke

  deploy:
    needs: test
    # Pull requests wel testen, niet publiceren.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
